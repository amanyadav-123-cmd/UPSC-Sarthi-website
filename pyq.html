<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previous Year Questions | UPSC Sarthi</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
        }

        img {
            max-width: 100%;
            height: auto;
        }

        .header {
            background-color: #1e90ff;
            color: white;
            padding: 25px 40px;
            height: 55px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: black;
        }

        .header h1 {
            font-size: 40px;
            margin: 0;
        }

        .header-links {
            display: flex;
            gap: 15px;
        }

        .nav-link {
            text-decoration: none;
            color: black;

            background-color: #2563eb;
            padding: 12px 20px;

            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;

            transition: 0.3s;
        }

        .nav-link:hover {
            background-color: #38bdf8;
            color: #172554;
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                gap: 20px;
                padding: 20px 10px;
            }

            .header h1 {
                font-size: 22px;
                text-align: center;
            }

            .header-links {
                gap: 10px;
            }

            .nav-link {
                padding: 10px 12px;
                font-size: 14px;
            }
        }

        footer {
            margin-top: 60px;
            background: #0d2b45;
            color: white;
            text-align: center;
            padding: 25px;
            height: 70px;
        }

        .subject-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .subject-item:last-child {
            border-bottom: none;
        }
    </style>
</head>

<body>
    <header class="header">
        <h2>Previous Year Questions</h2>
    </header>
